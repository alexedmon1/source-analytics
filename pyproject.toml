[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "source-analytics"
version = "0.6.0"
description = "Statistical analysis toolkit for source-localized EEG data (Python + R)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "pyyaml>=6.0",
    # specparam has no final 2.0 release: the index carries 2.0.0rc7 at the
    # latest, and PEP 440 sorts every rc below 2.0, so ">=2.0" resolved to
    # nothing at all. Published MS1 results used 2.0.0rc6; the lockfile pins
    # that exactly, and this floor merely lets the declaration resolve.
    "specparam>=2.0.0rc6",
    "joblib>=1.3",
    # Figures (matplotlib glass brains, comparison plots) are part of the core
    # lifecycle, so matplotlib is a core dependency, not an extra.
    "matplotlib>=3.7",
]

# Optional extras. The package imports without any of them; the modules that
# need one raise a clear ImportError naming the extra to install:
#   mne     -> the evoked / TFR modules (roi_evoked, vertex_evoked, electrode_evoked)
#   mvpa    -> vertex_signature / electrode_signature (scikit-learn)
#   network -> roi_graph / vertex_graph / *_network / *_nbs (networkx)
#   atlas   -> nibabel atlas readers
[project.optional-dependencies]
mne = ["mne>=1.5"]
atlas = ["nibabel>=5.0"]
mvpa = ["scikit-learn>=1.3"]
network = ["networkx>=3.0"]
render = ["markdown>=3.4"]
dev = ["pytest>=7.0", "black", "ruff"]
all = ["source-analytics[mne,atlas,mvpa,network,render,dev]"]

[project.scripts]
source-analytics = "source_analytics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# Ship the R scripts in wheels/sdists. They live outside the Python package
# (R/ beside src/), so they go in as data files under
# <sys.prefix>/share/source-analytics/R, where analyses.base.find_r_script_dir()
# looks after the repo checkout. MANIFEST.in grafts R/ into the sdist.
[tool.setuptools.data-files]
"share/source-analytics/R" = ["R/*.R"]

[tool.black]
line-length = 99

[tool.ruff]
line-length = 99
